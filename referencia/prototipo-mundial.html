<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundial de Café · Beneficios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#281722;--plum2:#1E1019;--plum3:#3A2330;--vino:#8E3949;--vino2:#A5485A;--arena:#C2A27B;--arena2:#DCC3A1;--crema:#F3E9DC;--linea:rgba(194,162,123,.25);--ok:#8FB38A;--mal:#E27A7A;
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--plum);color:var(--crema);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--arena);outline-offset:2px}
img{max-width:100%}
.demo{position:sticky;top:0;z-index:30;display:flex;gap:6px;justify-content:center;padding:8px;background:var(--plum2);border-bottom:1px solid var(--linea)}
.demo button{border:1px solid var(--linea);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--arena2)}
.demo button.on{background:var(--arena);color:var(--plum);border-color:var(--arena)}
.demo small{align-self:center;color:rgba(243,233,220,.5);font-size:11px;margin-right:4px}
/* ---------- visitante ---------- */
.tel{max-width:440px;margin:0 auto;min-height:calc(100vh - 50px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tel-in{padding:22px 20px 40px;flex:1;position:relative;z-index:1}
.deco{position:absolute;opacity:.16;pointer-events:none;z-index:0}
.logo{width:190px;display:block}
.h1{font-size:30px;line-height:1.1;font-weight:800;color:var(--arena);margin:22px 0 8px;letter-spacing:-.01em}
.lead{color:rgba(243,233,220,.82);margin:0}
.campo{margin-top:16px}
.campo label{display:block;font-size:14px;font-weight:600;color:var(--arena2);margin-bottom:6px}
.campo input,.campo select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--linea);background:rgba(255,255,255,.05);font-size:16px;color:var(--crema)}
.campo input::placeholder{color:rgba(243,233,220,.35)}
.campo input:focus,.campo select:focus{border-color:var(--arena);outline:none}
.campo.error input,.campo.error select{border-color:var(--mal)}
.err{color:var(--mal);font-size:13px;margin-top:5px}
.ayuda{font-size:12.5px;color:rgba(243,233,220,.55);margin-top:5px}
.fecha{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.fecha select{appearance:none;-webkit-appearance:none;background-image:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;border:1.5px solid var(--linea)}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;font-size:14px;color:var(--arena2)}
.seg button.on{background:var(--arena);color:var(--plum)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:rgba(243,233,220,.85)}
.check input{width:20px;height:20px;accent-color:var(--arena);flex:none;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--arena);color:var(--plum);font-weight:700;font-size:16px;margin-top:22px}
.btn:disabled{opacity:.45}
.btn.vino{background:var(--vino);color:var(--crema)}
.btn.linea{background:transparent;border:1.5px solid var(--arena);color:var(--arena)}
.link{border:0;background:none;color:var(--arena);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:14px}
.saludo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.saludo p{margin:0;color:rgba(243,233,220,.7);font-size:14px}
.saludo b{display:block;font-size:24px;line-height:1.15;color:var(--crema);font-weight:700}
.resumen-b{margin:18px 0 6px;font-size:14px;color:var(--arena2)}
/* cupón con muescas */
.cupon{position:relative;display:grid;grid-template-columns:78px 1fr;margin-top:14px;background:var(--crema);color:var(--plum);border-radius:16px;overflow:hidden}
.cupon::before,.cupon::after{content:"";position:absolute;left:78px;width:18px;height:18px;border-radius:50%;background:var(--plum);transform:translateX(-50%)}
.cupon::before{top:-9px}.cupon::after{bottom:-9px}
.cupon .emb{background:var(--plum3);display:grid;place-items:center;border-right:2px dashed rgba(40,23,34,.25)}
.cupon .emb img{width:58px;height:58px;border-radius:10px}
.cupon .cu{padding:14px 14px 14px 18px}
.cu-marca{font-size:13px;font-weight:600;color:var(--vino)}
.cu-marca span{color:rgba(40,23,34,.5);font-weight:500}
.cu-benef{font-size:21px;font-weight:800;line-height:1.1;margin:3px 0 4px}
.cu-cond{font-size:12.5px;color:rgba(40,23,34,.7);margin:0}
.cu-pie{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.granos{display:flex;gap:5px;align-items:center;font-size:12px;color:rgba(40,23,34,.7)}
.granos i{width:13px;height:13px;border-radius:50%;background:var(--vino);display:inline-block}
.granos i.usado{background:transparent;border:2px solid rgba(40,23,34,.25)}
.cu-usar{border:0;border-radius:10px;padding:9px 16px;background:var(--plum);color:var(--arena);font-weight:700;font-size:14px}
.cupon.agotado{opacity:.55}
.cupon.agotado .cu-usar{display:none}
.cu-vence{font-size:12.5px;font-weight:700;color:var(--vino);margin:6px 0 0}.cu-suc{font-size:12px;color:rgba(40,23,34,.7);margin:2px 0 0}
.logo-tile{display:grid;place-items:center;background:#fff;border-radius:10px;overflow:hidden;flex:none}.logo-tile img{max-width:88%;max-height:88%;object-fit:contain}
.demo-nota{margin-top:22px;border:1px dashed var(--linea);border-radius:12px;padding:10px 12px;font-size:13px;color:rgba(243,233,220,.7)}
.acceso{margin-top:10px;background:rgba(0,0,0,.18);border-radius:10px;padding:10px 12px;display:grid;gap:6px}.acceso span{display:block;font-size:12px;color:rgba(243,233,220,.6)}.acceso b{font-size:17px;letter-spacing:.06em;color:var(--crema)}.acceso small{display:block;font-size:12px;color:rgba(243,233,220,.6)}.acceso-b{display:flex;gap:12px;flex-wrap:wrap}
.guardado{margin:16px 0 0;font-size:13px;color:rgba(243,233,220,.7);background:rgba(194,162,123,.1);border-radius:10px;padding:8px 12px}.guardado b{color:var(--arena2);font-weight:600}
.hist{margin-top:26px}
.hist h2,.sec h2{font-size:17px;color:var(--arena);margin:0 0 8px}
.hist-it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px}
.hist-it span{color:rgba(243,233,220,.6)}
/* teclado */
.pasos{margin:14px 0 0;padding:0;list-style:none;counter-reset:p}
.pasos li{counter-increment:p;display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px}
.pasos li::before{content:counter(p);flex:none;width:26px;height:26px;border-radius:50%;background:var(--vino);color:var(--crema);display:grid;place-items:center;font-weight:700;font-size:13px}
.pin{display:flex;gap:10px;justify-content:center;margin:24px 0 8px}
.pin span{width:52px;height:62px;border-radius:12px;border:2px solid var(--linea);display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--arena)}
.pin span.lleno{border-color:var(--arena)}
.pin.mal span{border-color:var(--mal);animation:tiembla .35s}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.teclado button{border:0;border-radius:14px;background:rgba(255,255,255,.07);padding:16px 0;font-size:24px;font-weight:600;color:var(--crema)}
.teclado button:active{background:rgba(194,162,123,.3)}
.teclado .t-sec{font-size:15px;color:var(--arena2)}
.aviso{font-size:13.5px;text-align:center;color:rgba(243,233,220,.65);min-height:20px}
.aviso.mal{color:var(--mal)}
/* ticket de canje */
.canje{position:fixed;inset:0;z-index:40;background:var(--vino);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--crema)}
.canje-emb{width:150px;height:150px;animation:gira 6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.canje h2{font-size:32px;font-weight:800;margin:14px 0 2px;color:var(--crema)}
.canje .c-marca{font-size:17px;font-weight:600;color:var(--arena2)}
.canje .c-benef{font-size:24px;font-weight:800;margin:6px 0 0;color:#fff}
.canje .c-nom{margin-top:14px;font-size:15px}
.reloj{font-size:44px;font-weight:800;letter-spacing:.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.canje .c-num{font-size:14px;opacity:.85}
.canje .btn{max-width:360px}
@media (prefers-reduced-motion:reduce){.canje-emb{animation:none}}
/* ---------- back office ---------- */
.bo{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px}
.bo nav{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:3px}
.bo nav img{width:150px;margin:0 0 18px 8px}
.bo nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;font-size:15px;color:rgba(243,233,220,.7)}
.bo nav button.on{background:var(--plum3);color:var(--arena)}
.bo h1{font-size:26px;color:var(--arena);margin:0}
.bo .sub{color:rgba(243,233,220,.65);margin:4px 0 18px;font-size:14px}
.tarj{background:var(--plum3);border-radius:16px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat b{display:block;font-size:34px;font-weight:800;color:var(--arena);line-height:1.1}
.stat span{font-size:13px;color:rgba(243,233,220,.7)}
.barras{margin-top:10px}
.barra{display:grid;grid-template-columns:170px 1fr 50px;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.barra i{display:block;height:12px;border-radius:6px;background:var(--vino)}
.barra em{font-style:normal;text-align:right;font-weight:700;color:var(--arena)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--arena2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linea)}
td{padding:10px;border-bottom:1px solid rgba(194,162,123,.12);vertical-align:top}
.tabla{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:rgba(194,162,123,.18);color:var(--arena2)}
.pill.ok{background:rgba(143,179,138,.2);color:var(--ok)}
.pill.off{background:rgba(226,122,122,.15);color:var(--mal)}
.marcas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.marca{background:var(--plum3);border-radius:16px;padding:16px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.marca img{width:56px;height:56px;border-radius:10px}
.marca h3{margin:0;font-size:17px;color:var(--crema)}
.marca .mb{font-size:18px;font-weight:800;color:var(--arena);line-height:1.15;margin-top:4px}
.marca p{margin:4px 0 0;font-size:13px;color:rgba(243,233,220,.7)}
.codigo{font-size:22px;font-weight:800;letter-spacing:.2em;color:var(--crema)}
.acciones{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.form{background:var(--plum3);border-radius:16px;padding:18px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.embs{display:flex;gap:8px;flex-wrap:wrap}
.embs button{border:2px solid transparent;border-radius:12px;padding:0;background:none}
.embs button.on{border-color:var(--arena)}
.embs img{width:48px;height:48px;border-radius:9px;display:block}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn.chico{display:inline-block;width:auto;padding:10px 16px;font-size:14px;margin-top:0}
.buscar{padding:10px 14px;border-radius:10px;border:1.5px solid var(--linea);background:rgba(255,255,255,.05);min-width:240px}
/* carteles para imprimir */
.cartel{width:360px;background:var(--plum);border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:26px 24px 118px;text-align:center;box-shadow:0 0 0 1px var(--linea)}
.cartel .c-logo{width:210px}
.cartel h3{color:var(--arena);font-size:21px;line-height:1.15;font-weight:800;margin:18px 0 0}
.cartel .c-qr{background:#fff;border-radius:18px;border:3px solid var(--vino);padding:14px;margin-top:16px}
.cartel .c-qr div{width:170px;height:170px}
.cartel .c-paso{color:var(--arena2);font-size:13px;margin-top:12px;font-weight:600}
.cartel .c-pie{position:absolute;left:0;right:0;bottom:0}
.tcaja{width:320px;background:var(--crema);color:var(--plum);border-radius:14px;padding:18px;border:2px dashed var(--vino)}
.tcaja h4{margin:0;font-size:18px}
.tcaja .codigo{color:var(--vino);font-size:40px;letter-spacing:.25em;margin:6px 0}
.tcaja p{font-size:13px;margin:6px 0 0}
.carteles{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--crema);color:var(--plum);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:90vw}
@media (max-width:820px){.bo{grid-template-columns:1fr}.bo nav{position:static;flex-direction:row;flex-wrap:wrap}.bo nav img{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.barra{grid-template-columns:110px 1fr 40px}}
@media print{body.imprimiendo *{visibility:hidden}body.imprimiendo .imprimible,body.imprimiendo .imprimible *{visibility:visible}body.imprimiendo .imprimible{position:absolute;left:0;top:0}.cartel,.tcaja{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

function achicar(file,max=260){return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.onerror=mal;im.src=r.result};r.onerror=mal;r.readAsDataURL(file)})}

function validar(){const f=V.form,e={};const nom=(f.nombre||'').trim().replace(/\s+/g,' ');
  if(nom.split(' ').length<2||!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/.test(nom))e.nombre='Escribí tu nombre y tu apellido.';
  if(!f.dia||!f.mes||!f.anio)e.nac='Elegí día, mes y año.';else{const d=new Date(+f.anio,+f.mes-1,+f.dia);if(d.getMonth()!==+f.mes-1)e.nac='Esa fecha no existe. Revisá el día.';else if(edad(`${f.anio}-${pad(f.mes)}-${pad(f.dia)}`)<13)e.nac='Tenés que tener 13 años o más para registrarte.'}
  const c=(f.contacto||'').trim();if(f.via==='mail'){if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(c))e.contacto='Revisá el mail: tiene que ser como nombre@mail.com.'}else{const d=c.replace(/\D/g,'');if(d.length<10||d.length>11)e.contacto='Escribí el número con característica: 10 números, por ejemplo 261 555 1234.'}
  if(!f.acepto)e.acepto='Para darte los beneficios necesitamos que aceptes.';
  return e}

 visitantes(){const q=(V.q||'').toLowerCase(),ls=S.vis.filter(v=>!q||(v.nombre+v.mail+v.wa).toLowerCase().includes(q)).sort((a,b)=>b.ts.localeCompare(a.ts));
  return `<div class="fila"><div><h1>Visitantes</h1><p class="sub" style="margin-bottom:0">${S.vis.length} registrados. "Copiar para Sheets" copia la tabla entera para pegarla en una planilla.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="buscar" id="bq" placeholder="Buscar por nombre o contacto" value="${esc(V.q||'')}"><button class="btn chico" data-copiar="1">Copiar para Sheets</button></div></div>
  <div class="tarj tabla" style="margin-top:14px"><table><thead><tr><th>Nombre</th><th>Nacimiento</th><th>Contacto</th><th>Registro</th><th>Canjes</th><th>Novedades</th></tr></thead><tbody>${ls.map(v=>`<tr><td><b>${esc(v.nombre)}</b></td><td>${new Date(v.nac+'T12:00').toLocaleDateString('es-AR')} <span style="color:rgba(243,233,220,.5)">(${edad(v.nac)})</span></td><td>${esc(v.mail||v.wa)}</td><td>${new Date(v.ts).toLocaleDateString('es-AR',{weekday:'short',day:'numeric'})} ${hhmm(new Date(v.ts))}</td><td>${S.canjes.filter(c=>c.vis===v.id).length}</td><td>${v.marketing?'<span class="pill ok">Sí</span>':'<span class="pill">No</span>'}</td></tr>`).join('')||'<tr><td colspan="6">No hay visitantes con esa búsqueda.</td></tr>'}</tbody></table></div>`},
 canjes(){const f=V.fm||'todas',ls=S.canjes.filter(c=>f==='todas'||c.marca===f).sort((a,b)=>b.ts.localeCompare(a.ts));
  return `<div class="fila"><div><h1>Canjes</h1><p class="sub" style="margin-bottom:0">Cada beneficio usado, con hora y visitante. Sirve para liquidar con cada cafetería.</p></div><select class="buscar" id="fm" style="min-width:200px"><option value="todas">Todas las cafeterías</option>${S.marcas.map(m=>`<option value="${m.id}" ${f===m.id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></div>
  <div class="tarj tabla" style="margin-top:14px"><table><thead><tr><th>N°</th><th>Día y hora</th><th>Cafetería</th><th>Beneficio</th><th>Visitante</th></tr></thead><tbody>${ls.map(c=>`<tr><td>${String(c.n).padStart(4,'0')}</td><td>${new Date(c.ts).toLocaleDateString('es-AR',{weekday:'short',day:'numeric'})} ${hhmm(new Date(c.ts))}</td><td>${esc(marca(c.marca)?.nombre)}</td><td>${esc(marca(c.marca)?.beneficio)}</td><td>${esc(visitante(c.vis)?.nombre)}</td></tr>`).join('')||'<tr><td colspan="5">Todavía no hay canjes.</td></tr>'}</tbody></table></div>`}
};
function vistaBO(){return `<div class="bo"><nav><img src="${A.logo}" alt="Mundial de Café">${[['resumen','Resumen'],['marcas','Beneficios'],['visitantes','Visitantes'],['canjes','Canjes']].map(([k,n])=>`<button class="${V.bo===k?'on':''}" data-bo="${k}">${n}</button>`).join('')}</nav><section>${BO[V.bo]()}</section></div>`}
/* ---------------- panel de marca ---------------- */
function vistaMarca(){const m=V.pm&&marca(V.pm);
  if(!m)return `<div class="tel" style="max-width:460px"><div class="tel-in"><img class="logo" src="${A.logo}" alt="Mundial de Café" style="width:160px"><h1 class="h1" style="font-size:26px">Panel de tu marca</h1><p class="lead">Entrá con la clave que te dio la organización para ver tus canjes y configurar tu beneficio.</p>
    <div class="campo"><label for="pmClave">Clave de tu marca</label><input id="pmClave" autocapitalize="characters" placeholder="SHELBY-7Q"></div><button class="btn" data-pmentrar="1">Entrar</button>
    <div class="demo-nota">Demo: probá con SHELBY-JM o PAUSITA-SO.</div></div></div>`;
  if(V.logoTmp===undefined)V.logoTmp=m.logo||'';
  const cs=S.canjes.filter(c=>c.marca===m.id).sort((a,b)=>b.ts.localeCompare(a.ts)),post=cs.filter(c=>c.post).length;
  return `<div class="bo" style="grid-template-columns:1fr;max-width:860px"><section><div class="fila"><div style="display:flex;gap:14px;align-items:center">${embHTML(m,64)}<div><h1>${esc(m.nombre)}</h1><p class="sub" style="margin:2px 0 0">${esc(m.stand)} · ${esc(m.beneficio)}</p></div></div><button class="link" data-pmsalir="1">Salir</button></div>
  <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:18px"><div class="tarj stat"><b>${cs.length}</b><span>canjes en total</span></div><div class="tarj stat"><b>${cs.length-post}</b><span>durante el Mundial</span></div><div class="tarj stat"><b>${post}</b><span>en tus sucursales, después</span></div></div>
  ${m.enviado?`<div class="form"><div class="fila"><h2 style="margin:0;font-size:18px;color:var(--arena)">Tu cupón</h2><span class="pill ok">Enviado el ${new Date(m.enviado).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</span></div>
    <div style="display:flex;gap:14px;align-items:center;margin-top:14px">${embHTML(m,64)}<div><div style="font-size:20px;font-weight:800;color:var(--arena)">${esc(m.beneficio)}</div><p style="margin:2px 0 0;font-size:14px">${esc(m.condiciones)}</p></div></div>
    <p style="margin:14px 0 0">${soloEvento(m)?'Vale solo durante el Mundial.':`Vence el ${fDMY(m.vence)}.`}${!soloEvento(m)&&m.sucursales?` Después del Mundial, también en ${esc(m.sucursales)}.`:''}</p>
    <p style="margin:10px 0 0">Código de caja: <span class="codigo">${esc(m.codigo)}</span></p>
    <p class="ayuda" style="margin-top:12px">El cupón ya está en la billetera de los visitantes y no se puede modificar desde acá. Si necesitás cambiar algo, pedíselo a la organización del Mundial.</p></div>`
  :`<form class="form" id="fPm"><h2 style="margin:0;font-size:18px;color:var(--arena)">Tu cupón</h2><p class="ayuda">El beneficio y la cantidad de usos los define la organización. Completá tu logo, hasta cuándo vale y dónde se puede usar después, y envialo. <b>Una vez enviado no lo vas a poder cambiar ni eliminar.</b></p>
    ${formExtra(m)}
    <div class="campo"><label>Código de caja</label><span class="codigo">${esc(m.codigo)}</span><div class="ayuda">Tu personal se lo dice al visitante al pagar.</div></div>
    <button class="btn chico" type="submit" style="margin-top:14px">Enviar cupón</button></form>`}
  <div class="tarj tabla" style="margin-top:14px"><h2 style="margin:0 0 8px;font-size:17px;color:var(--arena)">Tus canjes</h2><table><thead><tr><th>N°</th><th>Día y hora</th><th>Visitante</th><th>Dónde</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${String(c.n).padStart(4,'0')}</td><td>${new Date(c.ts).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})} ${hhmm(new Date(c.ts))}</td><td>${esc(visitante(c.vis)?.nombre)}</td><td>${c.post?'Sucursal':'Mundial'}</td></tr>`).join('')||'<tr><td colspan="4">Todavía no hay canjes.</td></tr>'}</tbody></table></div></section></div>`}
function guardarPm(){const m=marca(V.pm);if(m.enviado)return;const ve=document.getElementById('mVence').value||EVENTO_FIN;if(ve<EVENTO_FIN){toast('El vencimiento no puede ser antes del 4 de octubre.');return}
  if(!confirm('¿Enviar tu cupón? Después no lo vas a poder cambiar ni eliminar: solo la organización puede hacerlo.'))return;
  m.logo=V.logoTmp||'';m.vence=ve;m.sucursales=document.getElementById('mSuc').value.trim();m.enviado=new Date().toISOString();guardar();render();toast('Cupón enviado. Los visitantes ya lo ven en su billetera.')}
/* ---------------- carteles ---------------- */
function vistaCarteles(){return `<div class="bo" style="grid-template-columns:1fr"><section><div class="fila"><div><h1>Carteles para imprimir</h1><p class="sub" style="margin-bottom:0">El QR de mesas y paredes lleva siempre a la misma página de registro.</p></div><button class="btn chico" data-imprimir="cartelMesa">Imprimir cartel</button></div>
  <div class="carteles"><div class="cartel imprimible" id="cartelMesa"><img class="c-logo" src="${A.logo}" alt="Mundial de Café by Bruno Brown"><h3>Escaneá y disfrutá de tus beneficios</h3><div class="c-qr"><div id="qrMesa"></div></div><div class="c-paso">Registrate una vez y usalo en cada stand</div><img class="c-pie" src="${A.guarda}" alt=""></div>
  <div style="max-width:380px"><h2 style="font-size:17px;color:var(--arena);margin:0">Tarjetas de caja</h2><p class="sub">Una por cafetería, para el personal del stand y de sus sucursales. El cajero le dice el código al visitante en el momento de pagar.</p>
  <div style="display:grid;gap:12px">${S.marcas.filter(m=>m.activo&&!m.eliminado).map(m=>`<div class="tcaja imprimible" id="tc-${m.id}"><h4>${esc(m.nombre)}</h4><p>Código de caja del Mundial de Café</p><div class="codigo">${esc(m.codigo)}</div><p><b>Beneficio:</b> ${esc(m.beneficio)}. ${esc(m.condiciones)}</p><p>Cuando un visitante quiera usar su beneficio, decile este código para que lo escriba en su celular. Te tiene que mostrar "Canje válido" con su nombre y la hora con los segundos moviéndose. Si la hora está quieta, es una captura de pantalla: no lo aceptes.</p></div><button class="link" data-imprimir="tc-${m.id}" style="justify-self:start">Imprimir tarjeta de ${esc(m.nombre)}</button>`).join('')}</div></div></div></section></div>`}
/* ---------------- render ---------------- */
let relojInt=null;
function render(){barra();const app=document.getElementById('app');
  app.innerHTML=V.modo==='visitante'?vistaVisitante():V.modo==='marca'?vistaMarca():V.modo==='bo'?vistaBO():vistaCarteles();
  clearInterval(relojInt);if(V.canje){relojInt=setInterval(()=>{const r=document.getElementById('reloj');if(r){const d=new Date();r.textContent=hhmm(d)+':'+pad(d.getSeconds())}},1000)}
  if(V.modo==='carteles'){const q=document.getElementById('qrMesa');if(q&&window.qrcode){const qr=qrcode(0,'M');qr.addData(location.href.split('#')[0]+'#registro');qr.make();q.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});const sv=q.querySelector('svg');if(sv){sv.style.width='100%';sv.style.height='100%';sv.querySelectorAll('path,rect').forEach(e=>{if(e.getAttribute('fill')==='black'||e.getAttribute('fill')==='#000000')e.setAttribute('fill','#281722')})}}}
  const bq=document.getElementById('bq');if(bq)bq.oninput=()=>{V.q=bq.value;const pos=bq.selectionStart;render();const n=document.getElementById('bq');n.focus();n.setSelectionRange(pos,pos)};
  const fm=document.getElementById('fm');if(fm)fm.onchange=()=>{V.fm=fm.value;render()};
  const fr=document.getElementById('fReg');if(fr)fr.onsubmit=ev=>{ev.preventDefault();leerForm();registrar()};
  const fma=document.getElementById('fMarca');if(fma)fma.onsubmit=ev=>{ev.preventDefault();guardarMarca()};
  const fpm=document.getElementById('fPm');if(fpm)fpm.onsubmit=ev=>{ev.preventDefault();guardarPm()};
  const ml=document.getElementById('mLogo');if(ml)ml.onchange=async()=>{const f=ml.files[0];if(!f)return;try{const keep={};['mVence','mSuc','mNom','mStand','mBen','mCond','mCred','mCod'].forEach(k=>{const e=document.getElementById(k);if(e)keep[k]=e.value});V.logoTmp=await achicar(f);render();Object.entries(keep).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v})}catch(e){toast('No se pudo leer la imagen.')}};
  const rc=document.getElementById('recCon');if(rc)rc.onkeydown=ev=>{if(ev.key==='Enter')recuperar()};}
function registrar(){const e=validar();V.errores=e;if(Object.keys(e).length){render();const p=document.querySelector('.campo.error input,.campo.error select');p&&p.focus();return}
  const f=V.form,contacto=f.via==='mail'?f.contacto.trim().toLowerCase():f.contacto.replace(/\D/g,'');
  const ya=S.vis.find(v=>(f.via==='mail'&&v.mail===contacto)||(f.via==='wa'&&v.wa===contacto));
  if(ya){S.yo=ya.id;guardar();V.form={via:'mail'};render();window.scrollTo(0,0);toast('Ya estabas registrado: acá están tus cupones.');return}
  const v={id:'v'+Date.now(),nombre:f.nombre.trim().replace(/\s+/g,' '),nac:`${f.anio}-${pad(f.mes)}-${pad(f.dia)}`,mail:f.via==='mail'?contacto:'',wa:f.via==='wa'?contacto:'',marketing:!!f.marketing,ts:new Date().toISOString()};
  S.vis.push(v);S.yo=v.id;guardar();V.form={via:'mail'};V.errores={};render();window.scrollTo(0,0)}
function recuperar(){const via=V.recVia||'mail',el=document.getElementById('recCon'),raw=(el?el.value:'').trim(),c=via==='mail'?raw.toLowerCase():raw.replace(/\D/g,'');
  if(!c){V.recErr=via==='mail'?'Escribí tu mail.':'Escribí tu número.';render();return}
  const v=S.vis.find(x=>(via==='mail'&&x.mail===c)||(via==='wa'&&x.wa===c));
  if(!v){V.recErr=`No encontramos cupones con ${via==='mail'?'ese mail':'ese número'}. Revisalo o registrate.`;render();return}
  S.yo=v.id;V.rec=false;V.recErr='';guardar();render();window.scrollTo(0,0);toast('Listo: estos son tus cupones.')}
function tecla(k){const m=marca(V.marcaUso),it=S.intentos[m.id]||(S.intentos[m.id]={n:0,hasta:0});if(it.hasta>Date.now())return;V.pinMal=false;
  if(k==='borrar'){V.pin=V.pin.slice(0,-1);V.aviso=null;render();return}
  if(V.pin.length>=4)return;V.pin+=k;
  if(V.pin.length===4){if(V.pin===m.codigo){if(vencido(m)){V.aviso={t:`Este beneficio venció el ${fDMY(m.vence)}.`,mal:true};V.pin='';render();return}if(!restantes(S.yo,m)){V.aviso={t:'Ya usaste todos los créditos de esta cafetería.',mal:true};V.pin='';render();return}
      S.num=(S.num||0)+1;const c={id:'c'+Date.now(),n:S.num,vis:S.yo,marca:m.id,ts:new Date().toISOString(),post:hoyIso()>EVENTO_FIN};S.canjes.push(c);it.n=0;guardar();V.canje=c.id;V.pin='';V.aviso=null;render()}
    else{it.n++;V.pinMal=true;V.pin='';if(it.n>=3){it.hasta=Date.now()+60000;it.n=0;V.aviso={t:'',mal:true}}else V.aviso={t:`Código incorrecto. Te quedan ${3-it.n} intento${3-it.n>1?'s':''}.`,mal:true};guardar();render();if(it.hasta>Date.now())setTimeout(render,60500)}
  }else render()}
function formExtra(ed){return `<div class="grid2"><div class="campo"><label>Logo de la marca</label><div style="display:flex;gap:12px;align-items:center">${V.logoTmp?`<span class="logo-tile" style="width:64px;height:64px"><img src="${V.logoTmp}" alt=""></span><button type="button" class="link" data-quitarlogo="1">Quitar</button>`:''}<label class="btn chico linea" style="margin:0;cursor:pointer">${V.logoTmp?'Cambiar':'Subir logo'}<input type="file" id="mLogo" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label></div><div class="ayuda">PNG o JPG. Aparece en el cupón en lugar de la figura.</div></div>
  <div class="campo"><label for="mVence">Vence el</label><input id="mVence" type="date" min="${EVENTO_FIN}" value="${esc(ed.vence||EVENTO_FIN)}"><div class="ayuda">Con el 4 de octubre, vale solo durante el Mundial. Con una fecha posterior, también se puede usar en las sucursales.</div></div></div>
  <div class="campo"><label for="mSuc">Dónde se puede usar después del Mundial</label><input id="mSuc" value="${esc(ed.sucursales||'')}" placeholder="Nombre de la sucursal y dirección"></div>`}
function guardarMarca(){const g=id=>document.getElementById(id).value.trim(),cod=g('mCod');
  if(!g('mNom')||!g('mBen')){toast('Completá la cafetería y el beneficio.');return}
  if(!/^\d{4}$/.test(cod)){toast('El código de caja tiene que ser de 4 números.');return}
  if(S.marcas.some(m=>m.codigo===cod&&m.id!==V.editar)){toast('Ese código ya lo usa otra cafetería. Elegí otro.');return}
  const ve=g('mVence')||EVENTO_FIN;if(ve<EVENTO_FIN){toast('El vencimiento no puede ser antes del final del Mundial (4 de octubre).');return}
  const datos={nombre:g('mNom'),stand:g('mStand'),beneficio:g('mBen'),condiciones:g('mCond'),creditos:Math.max(1,Math.min(10,Number(g('mCred'))||1)),codigo:cod,emblema:V.emb||(V.editar!=='nueva'&&marca(V.editar)?.emblema)||'taza',activo:document.getElementById('mAct').checked,logo:V.logoTmp||'',vence:ve,sucursales:g('mSuc'),responsable:g('mResp'),telResp:g('mTel').replace(/\D/g,'')};
  if(V.editar==='nueva')datos.clave=nuevaClave(g('mNom'));
  const era=V.editar;if(era==='nueva')S.marcas.push({id:'m'+Date.now(),...datos});else Object.assign(marca(era),datos);
  V.editar=null;V.emb=null;V.logoTmp=undefined;guardar();render();toast(era==='nueva'?`Marca creada. Su clave de acceso es ${datos.clave}.`:'Cambios guardados. Ya los ven los visitantes.')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-imprimir]');if(!b)return;const d=b.dataset;
  if(d.modo){V.modo=d.modo;V.editar=null;V.logoTmp=undefined;render();window.scrollTo(0,0);return}
  if(d.irrec){V.rec=true;V.recErr='';render();window.scrollTo(0,0);return}
  if(d.salirrec){V.rec=false;V.recErr='';render();return}
  if(d.recvia){V.recVia=d.recvia;V.recErr='';render();document.getElementById('recCon')?.focus();return}
  if(d.recuperar){recuperar();return}
  if(d.quitarlogo){V.logoTmp='';const keep={};['mVence','mSuc'].forEach(k=>{const e=document.getElementById(k);if(e)keep[k]=e.value});render();Object.entries(keep).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});return}
  if(d.pmentrar){const c=(document.getElementById('pmClave').value||'').trim().toUpperCase(),m=S.marcas.find(x=>!x.eliminado&&(x.clave||'').toUpperCase()===c);if(!m){toast('Esa clave no corresponde a ninguna marca.');return}V.pm=m.id;V.logoTmp=undefined;render();return}
  if(d.copclave){const m=marca(d.copclave);navigator.clipboard?.writeText(`Panel de ${m.nombre} en el Mundial de Café\n${linkPanel()}\nClave: ${m.clave}`).then(()=>toast('Acceso copiado: link y clave.'),()=>toast('No se pudo copiar.'));return}
  if(d.nuevaclave){const m=marca(d.nuevaclave);if(!confirm(`¿Generar una clave nueva para ${m.nombre}? La anterior deja de funcionar.`))return;m.clave=nuevaClave(m.nombre);guardar();render();toast(`Nueva clave de ${m.nombre}: ${m.clave}`);return}
  if(d.reabrir){const m=marca(d.reabrir);if(!confirm(`¿Habilitar a ${m.nombre} para cambiar su cupón? Va a tener que enviarlo de nuevo.`))return;m.enviado=null;guardar();render();toast(`${m.nombre} ya puede cambiar su cupón desde su panel.`);return}
  if(d.eliminar){const m=marca(d.eliminar),n=S.canjes.filter(c=>c.marca===m.id).length;if(!confirm(`¿Eliminar el cupón de ${m.nombre}? Desaparece de la billetera de todos los visitantes.${n?` Sus ${n} canjes quedan en el historial.`:''}`))return;m.eliminado=true;m.activo=false;guardar();render();toast(`Cupón de ${m.nombre} eliminado.`);return}
  if(d.pmsalir){V.pm=null;V.logoTmp=undefined;render();return}
  if(d.via){leerForm();V.form.via=d.via;V.form.contacto='';delete V.errores.contacto;render();document.getElementById('rCon')?.focus();return}
  if(d.usar){V.marcaUso=d.usar;V.pin='';V.aviso=null;V.pinMal=false;render();window.scrollTo(0,0);return}
  if(d.volver){V.marcaUso=null;V.pin='';V.aviso=null;render();return}
  if(d.tecla){tecla(d.tecla);return}
  if(d.listo){V.canje=null;V.marcaUso=null;render();window.scrollTo(0,0);return}
  if(d.salir){S.yo=null;guardar();V.form={via:'mail'};render();return}
  if(d.bo){V.bo=d.bo;V.editar=null;render();return}
  if(d.editar!==undefined){V.editar=d.editar||null;V.emb=null;V.logoTmp=undefined;render();document.getElementById('fMarca')?.scrollIntoView({behavior:'smooth'});return}
  if(d.emb){V.emb=d.emb;document.querySelectorAll('.embs button').forEach(x=>x.classList.toggle('on',x.dataset.emb===d.emb));return}
  if(d.nuevocod){let c;do{c=nuevoCodigo()}while(S.marcas.some(m=>m.codigo===c));document.getElementById('mCod').value=c;return}
  if(d.rotar){const m=marca(d.rotar);let c;do{c=nuevoCodigo()}while(S.marcas.some(x=>x.codigo===c));m.codigo=c;guardar();render();toast(`Nuevo código de ${m.nombre}: ${c}. Avisale al stand.`);return}
  if(d.copiar){const filas=[['Nombre','Nacimiento','Mail','WhatsApp','Registro','Canjes','Acepta novedades'],...S.vis.map(v=>[v.nombre,v.nac,v.mail,v.wa,v.ts,S.canjes.filter(c=>c.vis===v.id).length,v.marketing?'Sí':'No'])].map(r=>r.join('\t')).join('\n');
    navigator.clipboard?.writeText(filas).then(()=>toast('Copiado. Pegalo en la primera celda de una planilla.'),()=>toast('No se pudo copiar.'));return}
  if(d.imprimir){document.querySelectorAll('.imprimible').forEach(x=>x.classList.toggle('imprimible-on',x.id===d.imprimir));const el=document.getElementById(d.imprimir);document.querySelectorAll('.imprimible').forEach(x=>{if(x!==el)x.classList.remove('imprimible')});
    document.body.classList.add('imprimiendo');window.print();setTimeout(()=>{document.body.classList.remove('imprimiendo');render()},500);return}
});
document.addEventListener('keydown',ev=>{if(V.marcaUso&&!V.canje&&/^[0-9]$/.test(ev.key))tecla(ev.key);if(V.marcaUso&&ev.key==='Backspace')tecla('borrar')});
render();
</script>
</body>
</html>
